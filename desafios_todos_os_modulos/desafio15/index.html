<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de login</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,600,1,0&icon_names=mail,person,vpn_key"/>
    <link rel="stylesheet" href="estilos/mobile-first.css" media="all">
    <link rel="stylesheet" href="estilos/media-query.css">
</head>
<body>
    <main>
        <section>
            <div id="imagem"></div>
            <div class="maincontent">
                <h1>Login</h1>
                <p>
                    Bem-vindo(a) novamente! Digite suas informações de login para continuar com as configurações de sua conta.
                </p>
                <form autocomplete="off" class="formulario">
                    <span class="border-email-senha"><label for="iemail"><span class="material-symbols-outlined">person</span></label><input type="email" name="email" id="iemail" placeholder="Digite seu email" required></span><br>
                    <span class="border-email-senha"><label for="isenha"><span class="material-symbols-outlined">vpn_key</span></label><input type="password" name="senha" id="isenha" minlength="8" placeholder="Sua senha" autocomplete="current-password" required></span>
                    <input type="submit" value="Entrar" id="entrar">
                    <button type="button" id="recuperarsenha">Esqueci minha senha<span id="mailico" class="material-symbols-outlined">mail</span></button>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
