<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mude o tamanho da página e veja a responsividade</title>
    <link rel="stylesheet" href="Estilos/allstyle.css" media="all">
    <link rel="stylesheet" href="Estilos/tablet.css" media="screen and (min-width: 768px) and (max-width: 992px)">
    <link rel="stylesheet" href="Estilos/laptop.css" media="screen and (min-width: 992px) and (max-width: 1200px)">
    <link rel="stylesheet" href="Estilos/tv.css" media="screen and (min-width: 1200px)">
    <link rel="stylesheet" href="Estilos/media-query.css">
    <link rel="stylesheet" href="Estilos/printer.css" media="print">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=menu"/>
</head>
<body onresize="mostrarMenu()">
    <header>
        <nav>
            <span class="material-symbols-outlined" id="burger" onclick="clickMenu()">menu</span>
            <menu id="itens">
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">Sobre</a></li>
                    <li><a href="#">Contato</a></li>
                </ul>
            </menu>
        </nav>
    </header>
    <main>
        <h1>Testando Media Queries</h1>
        <img src="imagens/icon-phone.png" id="mobile">
        <img src="imagens/icon-tablet.png" id="tablet">
        <img src="imagens/icon-pc.png" id="laptop">
        <img src="imagens/icon-tv.png" id="tv">
        <img src="imagens/icon-print.png" id="print">
    </main>

    <script>
        function mostrarMenu(){
            if (window.innerWidth >= 768) {
                itens.style.display = 'block';
            } else {
                itens.style.display = 'none';
            }
        }
        function clickMenu() {
            if (itens.style.display == 'block') {
                itens.style.display = 'none';
            } else {
                itens.style.display = 'block';
            }
        }
    </script>
</body>
</html>
