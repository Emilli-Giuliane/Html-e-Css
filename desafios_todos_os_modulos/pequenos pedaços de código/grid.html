<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            border: 1px dotted black;
        }
        div.container {
            display: grid;
            height: 500px;
            /* flex-flow: row nowrap;
            flex: 1 1 auto; */
            /* grid-template-rows: 100px 100px 100px;
            grid-template-columns: 10px 10px 10px; */
            grid-template: repeat(3, 4fr) / repeat(4, 1fr);
            /* gap: 10px; */
            /* align-items: normal;
            justify-items: normal; */
            place-items: normal normal;
            /* justify-content: normal;
            align-content: normal; */
            place-content: normal normal;
            grid-auto-flow: column;
        }
        div#caixa1 {
            background-color: red;
            grid-row-start: 1;
            grid-row-end: 2;
            grid-column-start:1;
            grid-column-end:5;
        }
        div#caixa2 {
            background-color: green;
            /* grid-row-start: 2;
            grid-row-end: 4; */
            grid-row: 2 / 4;
            /* grid-column-start: 1;
            grid-column-end: 3; */
            grid-column: span 2;
        }
        div#caixa3{
            background-color: blue;
            /* grid-row-start: 2;
            grid-column-start: 3;
            grid-row-end: 4;
            grid-column-end: 5; */
            grid-area: 2 / 3 / span 2 / -1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="caixa1">A</div>
        <div id="caixa2">B</div>
        <div id="caixa3">C</div>
        <!-- <div>A</div>
        <div>B</div>
        <div>C</div>
        <div>A</div>
        <div>B</div>
        <div>C</div>
        <div>A</div>
        <div>B</div>
        <div>C</div>            -->
    </div>
</body>
</html>
