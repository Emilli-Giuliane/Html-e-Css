<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio: grid</title>
    <style>
        * {
            margin:0;
            padding:0;
            box-sizing: border-box;
            border: 1px dotted darkgreen;
        }
        html, body {
            height:100vh;
        }
        body {
            display:grid;
            grid-template: 150px auto 100px / repeat(4, 1fr);

            background-color: whitesmoke;
        }
        header {
            grid-area: 1 / 1 / 2 / -1;
            display: grid;
            grid-template: repeat(2, auto) / repeat(2, auto);
            align-content: space-between;
        }
        header > nav {
            grid-area: 2 / 1 / 3 / -1;
            
        }
        nav > ul {
            display: flex;
            align-items: flex-end;
            height: 100px;
                        
        }
        li {
            display: inline-block;
            width: 200px;
            background-color: gray;
        }

        main {
            grid-area: 2 / 1 / -2 / -1;
            display: grid;
            grid-template: 100px 1fr / 4fr 1fr;
        }
        main > aside {
            grid-area: 1 / -2 / -1 / -1;
        }
        footer {
            grid-area: -2 / 1 / -1 / -1;
        }

    </style>
</head>
<body>
    <header>
        header
        <nav>
            <ul>
                <li>a</li>
                <li>s</li>
                <li>d</li>
            </ul>
        </nav>
    </header>
    <main>
        main
        <aside>
            aside
        </aside>
    </main>
    <footer>
        footer
    </footer>
</body>
</html>
